name: Release OCR Models

on:
  push:
    tags:
      - 'recognition-models-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach assets to (e.g. recognition-models-1.0.0)'
        required: true
        default: 'recognition-models-1.0.0'

jobs:
  build:
    name: Build OCR models
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ inputs.tag_name }}"
          fi
          version="${tag#recognition-models-}"
          echo "name=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install paddle2onnx (no-deps, bypasses onnx<=1.17 constraint)
        run: pip install --no-deps paddle2onnx==2.1.0

      - name: Install Python dependencies
        run: pip install -r scripts/ocr-models/requirements.txt

      - name: Build language pack models
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/ocr-models/build_models.py --output output --mode language_pack

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          find output/rec -maxdepth 1 -name "*.zip" -exec cp {} dist/ \;

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Text Recognition Models ${{ steps.tag.outputs.version }}"
          body: |
            Additional text recognition models used by Klick'r 4.0.0 and above.
            Github/FDroid versions of the app will download the attached packages.
          make_latest: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
