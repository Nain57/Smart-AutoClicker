syntax = "proto3";
option java_multiple_files = true;

package com.buzbuz.smartautoclicker.core.smart.debugging;

import "ImageEventMessage.proto";
import "TriggerEventMessage.proto";

/**
 * Details about the verification of the conditions of an event holding a pointer on the screen.
 * Sent each time the held event conditions have been verified, telling if the pointer is kept held or released.
 */
message HeldEventCheckMessage {

    /** The unique identifier of the event holding the pointer. */
    int64 eventId = 1;

    /** The type of the event holding the pointer. */
    EventType eventType = 2;

    /** Tells if the pointer is kept held, or why it has been released. */
    HoldState holdState = 3;

    /** The duration since the pointer is held, in milliseconds. */
    int64 holdDurationMs = 4;

    /** The frame number in the current detection session. Only set for screen events. */
    int64 frameNumber = 5;

    /** The list of results for the conditions verified, if the event is a screen event. */
    repeated ImageEventMessage.ImageConditionResult imageConditionResults = 6;

    /** The list of results for the conditions verified, if the event is a trigger event. */
    repeated TriggerEventMessage.TriggerConditionResult triggerConditionResults = 7;

    /** The type of event holding the pointer. */
    enum EventType {
        EVENT_TYPE_UNSPECIFIED = 0;
        EVENT_TYPE_SCREEN = 1;
        EVENT_TYPE_TRIGGER = 2;
    }

    /** The state of the hold after the check. Released states tells the reason of the release. */
    enum HoldState {
        HOLD_STATE_UNSPECIFIED = 0;
        /** The event conditions are still fulfilled, the pointer is kept held. */
        HOLD_STATE_HELD = 1;
        /** The event conditions are no longer fulfilled, the pointer is released. */
        HOLD_STATE_RELEASED_UNFULFILLED = 2;
        /** The pointer has been lifted outside of the scenario, most likely by a user interaction. */
        HOLD_STATE_RELEASED_INTERRUPTED = 3;
        /** The held event has been disabled. */
        HOLD_STATE_RELEASED_EVENT_DISABLED = 4;
        /** The gesture of another event has taken over or ended the hold. */
        HOLD_STATE_RELEASED_OTHER_EVENT = 5;
        /** The screen orientation has changed. */
        HOLD_STATE_RELEASED_SCREEN_ROTATION = 6;
        /** The scenario has been stopped. */
        HOLD_STATE_RELEASED_SCENARIO_STOPPED = 7;
        /** All the actions of the held event have been executed. */
        HOLD_STATE_RELEASED_ACTIONS_COMPLETED = 8;
        /** The defined hold duration has elapsed. */
        HOLD_STATE_RELEASED_DURATION_ELAPSED = 9;
    }
}
